name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sfl_test
          POSTGRES_PASSWORD: sfl_test_only
          POSTGRES_DB: sfl_test
        # Disposable runner only. The application's Compose DB has no published port.
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sfl_test -d sfl_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sfl_test:sfl_test_only@localhost:5432/sfl_test
      TEST_DATABASE_URL: postgresql+psycopg://sfl_test:sfl_test_only@localhost:5432/sfl_test
      APP_ENV: test
      PUBLIC_ORIGIN: http://testserver
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend -e devices/printer
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest backend/tests
      - run: python scripts/test_compose.py
      - run: python -m pytest devices/printer/tests -q
      - run: python -m ruff check devices/printer scripts
      - run: python -m ruff format --check devices/printer scripts
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated Compose configuration
        run: |
          cp .env.example .env.ci
          python3 scripts/compose.py --env-file .env.ci config --quiet
      - name: Build images without publishing or deploying
        run: |
          docker build -f infra/backend.Dockerfile -t sfl-backend:ci .
          docker build -f infra/frontend.Dockerfile -t sfl-frontend:ci .
          docker build -f infra/minio.Dockerfile -t sfl-minio:ci .
