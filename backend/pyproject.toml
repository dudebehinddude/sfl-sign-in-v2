[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sfl-sign-in-api"
version = "0.1.0"
description = "LAN-first SFL sign-in application API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlmodel>=0.0.24,<0.1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pillow>=11,<14", "pglast>=7,<9", "email-validator>=2.2,<3", "minio>=7.2,<8", "procrastinate>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
