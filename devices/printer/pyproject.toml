[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sfl-printer-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["websockets>=15,<18", "pillow>=11,<14", "python-dotenv>=1,<2"]

[project.optional-dependencies]
usb = ["brother-ql>=0.9,<1", "pyusb>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
sfl-printer = "sfl_printer.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sfl_printer"]
